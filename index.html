<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>팔도유랑단 · 커플 여행 대동여지도</title>
<style>
:root{--ink:#1c1230;--soft:#7a6b95;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  background:linear-gradient(135deg,#ff9be2 0%,#a78bfa 38%,#7dd3fc 72%,#a7f3d0 100%);
  background-attachment:fixed;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;}
.wrap{max-width:1080px;margin:0 auto;padding:30px 20px 80px}
header{text-align:center;margin-bottom:8px}
header h1{font-size:34px;letter-spacing:-1px;font-weight:900;color:#fff;text-shadow:0 4px 20px rgba(120,40,160,.35)}
header h1 .em{background:linear-gradient(90deg,#fff,#ffe6fb);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin-top:12px;color:rgba(255,255,255,.92);font-size:15px;line-height:1.65;font-weight:500}
.badge{display:inline-block;margin-top:14px;background:rgba(255,255,255,.25);color:#fff;font-size:12.5px;font-weight:800;padding:7px 16px;border-radius:999px;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.4)}
.searchbar{margin:20px auto 0;max-width:420px;position:relative}
.searchbar input{width:100%;padding:14px 48px 14px 18px;border-radius:999px;border:none;
  background:rgba(255,255,255,.92);font-size:15px;font-weight:600;color:var(--ink);
  box-shadow:0 8px 24px -8px rgba(90,30,140,.3);outline:none;font-family:inherit}
.searchbar input::placeholder{color:#b0a0c0;font-weight:500}
.searchbar .sico{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:rgba(255,255,255,.97);
  border-radius:20px;box-shadow:0 16px 40px -10px rgba(90,30,140,.35);overflow:hidden;z-index:30;display:none}
.search-results.show{display:block}
.sr-item{display:flex;align-items:center;gap:10px;padding:12px 18px;cursor:pointer;transition:background .15s;border:none;width:100%;text-align:left;background:transparent;font-family:inherit}
.sr-item:hover{background:#f5eeff}
.sr-item:not(:last-child){border-bottom:1px solid #f0e8ff}
.sr-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.sr-dot.active{background:#ff0a85}
.sr-dot.soon{background:#c084fc}
.sr-info{flex:1}
.sr-title{font-size:14px;font-weight:700;color:var(--ink)}
.sr-region{font-size:12px;color:var(--soft);margin-top:2px}
.sr-empty{padding:16px 18px;font-size:14px;color:var(--soft);text-align:center}
.stage{display:flex;gap:26px;align-items:flex-start;margin-top:20px;flex-wrap:wrap;justify-content:center}
.mapcard{position:relative;background:rgba(255,255,255,.22);border-radius:32px;padding:14px;
  box-shadow:0 24px 60px -20px rgba(90,30,140,.5);border:1.5px solid rgba(255,255,255,.5);backdrop-filter:blur(14px)}
.viewport{width:min(440px,86vw);height:min(560px,110vw);overflow:hidden;border-radius:24px;
  touch-action:none;background:linear-gradient(170deg,#fff0fb,#eef4ff);position:relative;}
#mapsvg{position:absolute;width:100%;height:100%;top:0;left:0;display:block;transform-origin:50% 50%;}
.province{fill:#ffd9f4;stroke:#fff;stroke-width:1.4;stroke-linejoin:round;}
.province.featured{fill:#ffb3e6}
.pin{cursor:pointer}
.pin .pb{transition:transform .18s;transform-box:fill-box;transform-origin:center}
.pin:hover .pb{transform:scale(1.35)}
.pin.soon .p-outer{fill:#c084fc}
.pin.active .p-outer{fill:#ff0a85}
.pin.highlight .p-outer{fill:#ff6200}
.pin .p-inner{fill:rgba(255,255,255,.9)}
.p-ring{fill:none;stroke-width:2}
.pin.soon .p-ring{stroke:#c084fc}
.pin.active .p-ring{stroke:#ff0a85}
.pin.active .p-ring{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{r:8;opacity:.5}70%{r:20;opacity:0}100%{opacity:0}}
.pin-lbg{fill:rgba(255,255,255,.9);pointer-events:none}
.pin-ltxt{font-size:7.5px;font-weight:800;pointer-events:none;font-family:"Pretendard","Apple SD Gothic Neo",sans-serif}
.pin.soon .pin-ltxt{fill:#7c3aed}
.pin.active .pin-ltxt{fill:#be185d}
.zoomctl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:4px;z-index:10}
.zoomctl button{width:32px;height:32px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);
  background:rgba(255,255,255,.5);color:#c0238a;font-size:16px;font-weight:900;cursor:pointer;
  box-shadow:0 4px 10px -4px rgba(180,30,130,.4);backdrop-filter:blur(8px);
  transition:transform .12s;display:flex;align-items:center;justify-content:center;line-height:1}
.zoomctl button:active{transform:scale(.88)}
.panel{width:330px;background:rgba(255,255,255,.9);border-radius:28px;border:1.5px solid rgba(255,255,255,.7);
  box-shadow:0 24px 60px -22px rgba(90,30,140,.45);padding:26px;min-height:200px;display:flex;flex-direction:column;backdrop-filter:blur(14px)}
.panel .placeholder{color:var(--soft);font-size:14px;line-height:1.7;margin:auto;text-align:center}
.panel .placeholder b{display:block;font-size:17px;color:var(--ink);margin-bottom:8px}
.gtitle{font-size:22px;font-weight:900;letter-spacing:-.6px;line-height:1.3}
.gregion{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(90deg,#ff5fbf,#b06bff);padding:4px 12px;border-radius:999px}
.gdesc{margin-top:14px;font-size:14px;line-height:1.7;color:#574868}
.gtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.gtags span{font-size:12px;background:linear-gradient(90deg,#e0f2fe,#ede9fe);color:#7c3aed;padding:6px 12px;border-radius:999px;font-weight:700}
.gprice{margin-top:18px;font-size:13px;color:var(--soft)}
.gprice b{font-size:24px;color:var(--ink);font-weight:900}
.buybtn{margin-top:16px;display:block;text-align:center;text-decoration:none;
  background:linear-gradient(95deg,#ff45a8,#b06bff,#6aa8ff);color:#fff;font-weight:900;font-size:15px;
  padding:16px;border-radius:18px;box-shadow:0 12px 26px -8px rgba(200,40,150,.6);transition:transform .15s}
.buybtn:hover{transform:translateY(-2px)}
.overlay{position:fixed;inset:0;background:rgba(40,10,60,.4);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.show{display:flex}
.sheet{background:rgba(255,255,255,.97);width:100%;max-width:480px;border-radius:28px 28px 0 0;position:relative;padding:26px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.overlay.show .sheet{transform:translateY(0)}
.sheet .grip{width:44px;height:5px;background:linear-gradient(90deg,#ff8ad4,#b08bff);border-radius:99px;margin:0 auto 16px}
.closex{position:absolute;top:14px;right:18px;font-size:24px;color:#cbb6dd;background:none;border:none;cursor:pointer}
footer{text-align:center;margin-top:46px;color:rgba(255,255,255,.85);font-size:12.5px;line-height:1.7;font-weight:500}
@media(max-width:860px){.panel{display:none}.stage{margin-top:18px}}
@media(min-width:861px){.overlay{display:none!important}}
</style>

<script>
const GUIDES=[{"id": "masan", "prov": "경상남도", "title": "마산·창원 신혼 여행 가이드", "region": "경남 · 마산/창원", "status": "active", "desc": "마산·창원 일대를 신혼·커플 기준으로 짠 가이드. 추천 코스 5개, 핵심 명소 50선, 예산 시뮬레이터까지.", "tags": ["1박2일", "당일치기", "커플"], "price": "9,900원", "url": "https://smartstore.naver.com/", "xy": [289.1, 296.1]}, {"id": "seoul", "prov": "서울특별시", "region": "서울", "title": "서울 가이드", "status": "soon", "xy": [176.5, 105.5]}, {"id": "incheon", "prov": "인천광역시", "region": "인천", "title": "인천 가이드", "status": "soon", "xy": [158.5, 114.4]}, {"id": "gyeonggi", "prov": "경기도", "region": "경기", "title": "경기 가이드", "status": "soon", "xy": [179.9, 130.1]}, {"id": "gangwon_e", "prov": "강원도", "region": "강원 · 강릉/속초", "title": "강원 동해안 가이드", "status": "soon", "xy": [302.0, 90.4]}, {"id": "gangwon_w", "prov": "강원도", "region": "강원 · 춘천/평창", "title": "강원 내륙 가이드", "status": "soon", "xy": [226.2, 79.8]}, {"id": "daejeon", "prov": "대전광역시", "region": "대전", "title": "대전 가이드", "status": "soon", "xy": [203.4, 204.6]}, {"id": "sejong", "prov": "세종특별자치시", "region": "세종", "title": "세종 가이드", "status": "soon", "xy": [197.1, 194.0]}, {"id": "chungju", "prov": "충청북도", "region": "충북 · 충주", "title": "충주 가이드", "status": "soon", "xy": [239.1, 152.4]}, {"id": "cheongju", "prov": "충청북도", "region": "충북 · 청주", "title": "청주 가이드", "status": "soon", "xy": [210.3, 181.2]}, {"id": "dangjin", "prov": "충청남도", "region": "충남 · 당진", "title": "당진 가이드", "status": "soon", "xy": [153.4, 160.6]}, {"id": "boryeong", "prov": "충청남도", "region": "충남 · 보령", "title": "보령 가이드", "status": "soon", "xy": [152.4, 206.0]}, {"id": "jeonju", "prov": "전라북도", "region": "전북 · 전주", "title": "전주 가이드", "status": "soon", "xy": [187.8, 247.5]}, {"id": "gunsan", "prov": "전라북도", "region": "전북 · 군산", "title": "군산 가이드", "status": "soon", "xy": [160.5, 235.9]}, {"id": "gwangju", "prov": "광주광역시", "region": "광주", "title": "광주 가이드", "status": "soon", "xy": [168.2, 301.7]}, {"id": "yeonggwang", "prov": "전라남도", "region": "전남 · 영광", "title": "영광 가이드", "status": "soon", "xy": [145.7, 292.1]}, {"id": "gokseong", "prov": "전라남도", "region": "전남 · 곡성", "title": "곡성 가이드", "status": "soon", "xy": [197.3, 291.7]}, {"id": "yeosu", "prov": "전라남도", "region": "전남 · 여수", "title": "여수 가이드", "status": "soon", "xy": [221.8, 334.2]}, {"id": "daegu", "prov": "대구광역시", "region": "대구", "title": "대구 가이드", "status": "soon", "xy": [283.8, 243.9]}, {"id": "gyeongju", "prov": "경상북도", "region": "경북 · 경주", "title": "경주 가이드", "status": "soon", "xy": [324.1, 244.9]}, {"id": "andong", "prov": "경상북도", "region": "경북 · 안동", "title": "안동 가이드", "status": "soon", "xy": [292.3, 186.9]}, {"id": "busan_e", "prov": "부산광역시", "region": "부산 동부", "title": "부산 동부 가이드", "status": "soon", "xy": [316.8, 300.1]}, {"id": "busan_w", "prov": "부산광역시", "region": "부산 서부", "title": "부산 서부·원도심 가이드", "status": "soon", "xy": [308.9, 306.6]}, {"id": "ulsan", "prov": "울산광역시", "region": "울산", "title": "울산 가이드", "status": "soon", "xy": [330.8, 270.8]}, {"id": "tongyeong", "prov": "경상남도", "region": "경남 · 통영", "title": "통영 가이드", "status": "soon", "xy": [272.7, 326.7]}, {"id": "jeju1", "prov": "제주특별자치도", "region": "제주 · 제주시", "title": "제주 가이드 (제주시)", "status": "soon", "xy": [147.0, 437.2]}, {"id": "jeju2", "prov": "제주특별자치도", "region": "제주 · 서귀포", "title": "제주 가이드 (서귀포)", "status": "soon", "xy": [148.9, 457.2]}, {"id": "ulleung", "prov": "경상북도", "region": "경북 · 울릉도", "title": "울릉도 가이드", "status": "soon", "inset": "ulleung", "xy": [436.1, 111.0]}, {"id": "dokdo", "prov": "경상북도", "region": "경북 · 독도", "title": "독도 가이드", "status": "soon", "inset": "ulleung", "xy": [499.8, 132.0]}];
const SVGNS='http://www.w3.org/2000/svg';
const vp=document.getElementById('viewport');
const svg=document.getElementById('mapsvg');
const pinG=document.getElementById('pins');

// 강원도만 핑크 강조
document.querySelectorAll('.province').forEach(p=>{
  if(p.dataset.name==='강원도') p.classList.add('featured');
});

// 핀 생성
const pinEls={};
GUIDES.forEach(g=>{
  const [x,y]=g.xy;
  const grp=document.createElementNS(SVGNS,'g');
  grp.setAttribute('class','pin '+(g.status==='active'?'active':'soon'));
  grp.setAttribute('transform',`translate(${x},${y})`);
  const short=g.region.split('·').pop().trim();
  const lw=short.length*5.5+8;
  grp.innerHTML=`
    <circle class="p-ring" cx="0" cy="0" r="8"></circle>
    <g class="pb">
      <circle class="p-outer" cx="0" cy="0" r="7"></circle>
      <circle class="p-inner" cx="0" cy="0" r="3"></circle>
    </g>
    <rect class="pin-lbg" x="${-lw/2}" y="-20" width="${lw}" height="12" rx="6"></rect>
    <text class="pin-ltxt" x="0" y="-11" text-anchor="middle">${short}</text>`;
  pinG.appendChild(grp);
  pinEls[g.id]=grp;
});

/* ── Zoom & Pan ──
   핀 클릭 버그 수정:
   - pointerdown에서 setPointerCapture 제거 (핀 click 이벤트 막았던 원인)
   - 대신 pointermove 거리로 드래그/탭 구분
   - 핀은 SVG click 이벤트로 처리 (bubble up 방식) */
let scale=1, tx=0, ty=0;
const MIN=0.9, MAX=6;

function applyT(){
  svg.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
}
function clamp(){
  if(scale<=1){tx=0;ty=0;return;}
  const w=vp.clientWidth, h=vp.clientHeight;
  const ex=w*(scale-1)/2+w*0.2, ey=h*(scale-1)/2+h*0.2;
  tx=Math.min(ex,Math.max(-ex,tx));
  ty=Math.min(ey,Math.max(-ey,ty));
}
function zoomAt(cx,cy,f){
  const ns=Math.min(MAX,Math.max(MIN,scale*f));
  const hw=vp.clientWidth/2, hh=vp.clientHeight/2;
  const k=ns/scale;
  tx=(tx-(cx-hw))*k+(cx-hw);
  ty=(ty-(cy-hh))*k+(cy-hh);
  scale=ns; clamp(); applyT();
}

vp.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=vp.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.15:1/1.15);
},{passive:false});

// 드래그: pointerCapture 없이 처리. 이동거리 5px 이상이면 드래그로 판단.
let pdown=false, moved=false, sx=0, sy=0, startTx=0, startTy=0;
vp.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch' && e.isPrimary===false) return;
  pdown=true; moved=false;
  sx=e.clientX; sy=e.clientY;
  startTx=tx; startTy=ty;
});
vp.addEventListener('pointermove',e=>{
  if(!pdown) return;
  const dx=e.clientX-sx, dy=e.clientY-sy;
  if(!moved && Math.hypot(dx,dy)<5) return;
  moved=true;
  vp.style.cursor='grabbing';
  tx=startTx+dx; ty=startTy+dy; clamp(); applyT();
});
vp.addEventListener('pointerup',()=>{
  pdown=false; vp.style.cursor='';
});
vp.addEventListener('pointerleave',()=>{
  pdown=false; vp.style.cursor='';
});

// 핀 클릭: SVG click 이벤트 (드래그 아닐 때만)
svg.addEventListener('click',e=>{
  if(moved) return; // 드래그 후 손 뗄 때 무시
  const grp=e.target.closest('.pin');
  if(!grp) return;
  const id=Object.keys(pinEls).find(k=>pinEls[k]===grp);
  if(!id) return;
  const g=GUIDES.find(x=>x.id===id);
  if(g) select(g);
});

// 핀치 줌
let pts=new Map(), pdist=0;
vp.addEventListener('touchstart',e=>{
  [...e.touches].forEach(t=>pts.set(t.identifier,t));
},{passive:true});
vp.addEventListener('touchmove',e=>{
  e.preventDefault();
  [...e.touches].forEach(t=>pts.set(t.identifier,t));
  if(e.touches.length===2){
    const [a,b]=[e.touches[0],e.touches[1]];
    const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    if(pdist){
      const r=vp.getBoundingClientRect();
      zoomAt((a.clientX+b.clientX)/2-r.left,(a.clientY+b.clientY)/2-r.top,d/pdist);
    }
    pdist=d; pdown=false;
  }
},{passive:false});
vp.addEventListener('touchend',e=>{
  if(e.touches.length<2) pdist=0;
},{passive:true});

document.getElementById('zin').onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,1.3);
document.getElementById('zout').onclick=()=>zoomAt(vp.clientWidth/2,vp.clientHeight/2,1/1.3);
document.getElementById('zreset').onclick=()=>{scale=1;tx=0;ty=0;applyT();};

// 검색
const inp=document.getElementById('searchInput');
const res=document.getElementById('searchResults');
inp.addEventListener('input',()=>{
  const q=inp.value.trim();
  if(!q){res.classList.remove('show');return;}
  const hits=GUIDES.filter(g=>
    g.title.includes(q)||g.region.includes(q)||g.prov.includes(q)||(g.desc&&g.desc.includes(q))
  );
  res.innerHTML=hits.length
    ? hits.map(g=>`<button class="sr-item" data-id="${g.id}">
        <span class="sr-dot ${g.status}"></span>
        <span class="sr-info">
          <span class="sr-title">${g.title}</span>
          <span class="sr-region">📍 ${g.region}</span>
        </span></button>`).join('')
    : `<div class="sr-empty">검색 결과가 없어요 🥲</div>`;
  res.querySelectorAll('.sr-item').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const g=GUIDES.find(x=>x.id===btn.dataset.id);
      inp.value=''; res.classList.remove('show');
      select(g);
      Object.values(pinEls).forEach(el=>el.classList.remove('highlight'));
      if(pinEls[g.id]) pinEls[g.id].classList.add('highlight');
    });
  });
  res.classList.add('show');
});
inp.addEventListener('blur',()=>setTimeout(()=>res.classList.remove('show'),150));
document.addEventListener('click',e=>{if(!e.target.closest('.searchbar'))res.classList.remove('show');});

// 상세 팝업
function detailHTML(g){
  const desc=g.desc||'이 지역을 신혼·커플 기준으로 정리한 여행 가이드북이에요. 추천 코스와 명소, 예산 정보까지 담았습니다.';
  const tags=(g.tags||['추천 코스','명소','예산 가이드']).map(t=>`<span>${t}</span>`).join('');
  return `<div class="gtitle">${g.title}</div>
    <span class="gregion">📍 ${g.region}</span>
    <div class="gdesc">${desc}</div>
    <div class="gtags">${tags}</div>
    <div class="gprice">판매가 <b>${g.price||'9,900원'}</b></div>
    <a class="buybtn" href="${g.url||'https://smartstore.naver.com/'}" target="_blank" rel="noopener">네이버 스마트스토어에서 구매하기 →</a>`;
}
function select(g){
  if(window.innerWidth>860){
    document.getElementById('ph').style.display='none';
    const det=document.getElementById('detail');
    det.style.display='block'; det.innerHTML=detailHTML(g);
  } else {
    document.getElementById('sheetbody').innerHTML=detailHTML(g);
    document.getElementById('overlay').classList.add('show');
  }
}
function closeSheet(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').addEventListener('click',e=>{
  if(e.target.id==='overlay') closeSheet();
});
applyT();
</script>
